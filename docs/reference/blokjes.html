<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blokjes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='3' width='9' height='26' rx='2' fill='%233F86DB'/%3E%3Crect x='17' y='18' width='11' height='11' rx='2.5' fill='%234FAE48'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F3F0FA;--ink:#2C2440;--ink2:#655D80;--line:#DCD6EA;--card:#FFFFFF;--soft:#E8E3F4;--spot:#E2DAF3;
  --go:#FF8A3D;--go-edge:#D9692A;--go-ink:#3A1A00;--good:#2C7F45;--bad:#B3261E;
  --wood:#E6CFA6;--wood-edge:#C9A874;--wood-dark:#A9875A;--tray-ink:#5A4325;--tray-line:rgba(90,67,37,.32);
  --one:#4FAE48;--one-d:#2E7A2A;--one-ink:#2E7A2A;--one-soft:#E2F3DE;
  --ten:#3F86DB;--ten-d:#1F5BA6;--ten-ink:#1F5BA6;--ten-soft:#DCEAFB;
  --pep:#A0662E;--rv:#7B5BD0;--rv-soft:#E9E1FA;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1828;--ink:#EEEAF7;--ink2:#AFA7C6;--line:#3A3350;--card:#282338;--soft:#312B44;--spot:#4A4163;
    --good:#7BD38E;--bad:#FF8A80;--one-ink:#94D886;--one-soft:#25402A;--ten-ink:#93C1F4;--ten-soft:#21395A;
    --wood:#D2B587;--wood-edge:#A88B5E;--wood-dark:#7E6440;--rv:#B39BF5;--rv-soft:#3A2F5C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1828;--ink:#EEEAF7;--ink2:#AFA7C6;--line:#3A3350;--card:#282338;--soft:#312B44;--spot:#4A4163;
  --good:#7BD38E;--bad:#FF8A80;--one-ink:#94D886;--one-soft:#25402A;--ten-ink:#93C1F4;--ten-soft:#21395A;
  --wood:#D2B587;--wood-edge:#A88B5E;--wood-dark:#7E6440;--rv:#B39BF5;--rv-soft:#3A2F5C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,.f{font-family:"Fredoka",ui-rounded,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600}
h1{font-size:34px;line-height:1.15;margin:0}
h2{font-size:21px;line-height:1.25;margin:0 0 10px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ten);outline-offset:3px}
[hidden]{display:none!important}
.app{max-width:1000px;margin:0 auto;padding:12px 16px 32px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-size:24px}
.brand svg{width:28px;height:28px}
.toggles{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.icon-btn{width:42px;height:42px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}

.btn{font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:20px;border:0;border-radius:16px;padding:14px 28px;background:var(--go);color:var(--go-ink);cursor:pointer;box-shadow:0 4px 0 var(--go-edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--go-edge)}
.btn.quiet{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);font-size:18px;padding:12px 20px}
.btn.quiet:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{font-size:16px;padding:9px 14px}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px;padding:6px}

.dogwrap{border-radius:50%;background:var(--spot);display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.dogwrap svg{width:82%;height:82%;overflow:visible}
.dog .tail,.dog .head,.dog .eyes-open{transform-box:view-box}
.dog .tail{transform-origin:86px 98px}
.dog .head{transform-origin:60px 72px;transition:transform .35s ease}
.dog .eyes-open{transform-origin:60px 45px;animation:blink 5.5s infinite}
.dog .tongue,.dog .eyes-shut,.dog .zz{display:none}
.dog.happy .tail{animation:wag .16s ease-in-out infinite alternate}
.dog.happy .tongue{display:block}
.dog.happy svg{animation:hop .45s ease-out 2}
.dog.think .head{transform:rotate(-9deg)}
.dog.gentle .head{transform:rotate(7deg) translateY(2px)}
.dog.sleep .eyes-open{display:none}
.dog.sleep .eyes-shut,.dog.sleep .zz{display:block}
.dog.sleep .zz{animation:zz 2.4s ease-in-out infinite}
.dog.roll svg{animation:roll .9s ease-in-out}
@keyframes wag{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.bubble{position:absolute;right:calc(100% + 6px);top:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;font-size:15px;white-space:nowrap;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s;pointer-events:none;color:var(--ink)}
.bubble.on{opacity:1;transform:scale(1)}
.hero .bubble{right:auto;left:calc(100% - 10px);top:0}

.hero{display:flex;align-items:center;gap:18px;margin:6px 0 22px}
.hero .dogwrap{width:118px;height:118px;cursor:pointer}
.hero p{margin:6px 0 0;color:var(--ink2)}
.today{background:var(--card);border-radius:24px;padding:22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;border:2px solid var(--line)}
.today p{margin:4px 0 0;color:var(--ink2);max-width:46ch}
.today .acts{display:flex;gap:10px;flex-wrap:wrap}
.week{display:flex;gap:8px;margin:22px 0 28px;align-items:center;flex-wrap:wrap}
.week .lbl{color:var(--ink2);font-size:15px;margin-right:6px}
.day{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);color:var(--ink2)}
.day.on{background:var(--one);color:#0F3A0C}
.day.today{box-shadow:inset 0 0 0 2px var(--ink2)}
.path{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.path li{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;border:2px solid transparent}
.path li.cur{border-color:var(--go)}
.path li.lock{opacity:.55}
.opt{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--soft);color:var(--ink2)}
.path li.done .opt{background:var(--one);color:#0F3A0C}
.path li.cur .opt{background:var(--go);color:var(--go-ink)}
.pname{font-weight:700}
.psub{color:var(--ink2);font-size:15px}
.pips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.pip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.pip.on{background:var(--ten-soft);color:var(--ten-ink)}
.ptxt{min-width:0}
.home-foot{margin-top:26px;text-align:center}

/* session */
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prog{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.prog i{height:9px;border-radius:5px;background:var(--soft)}
.prog i.done{background:var(--one)}
.prog i.miss{background:var(--wood-edge)}
.prog i.now{background:var(--go)}
.prog i.rv{background:none;box-shadow:inset 0 0 0 2px var(--rv)}
.prog i.rv.now{background:var(--rv);box-shadow:none}
.prog i.rv.done{background:var(--one);box-shadow:none}
.prog i.rv.miss{background:var(--wood-edge);box-shadow:none}
.sdog{width:50px;height:50px;cursor:pointer}
.sbar .icon-btn{width:38px;height:38px}
.slabel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--ink2)}
.slabel b{color:var(--ink);font-weight:700}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ten-soft);color:var(--ten-ink)}
.chip.rev{background:var(--rv);color:#FFFFFF;display:inline-flex;align-items:center;gap:4px}
.chip.rev svg{width:13px;height:13px}
.opx{display:inline-grid;place-items:center;min-width:1.15em;padding:0 .12em;border-radius:12px;background:var(--rv-soft);color:var(--rv);animation:opx 1.2s ease-out 1}
@keyframes opx{0%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(.95)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.msg.rv{color:var(--rv);font-weight:700}
.sess{display:grid;grid-template-areas:"label" "eq" "tray" "msg" "pad";gap:8px}
.slabel{grid-area:label}.eq{grid-area:eq}.tray{grid-area:tray}.msg{grid-area:msg}.padw{grid-area:pad}

.eq{display:flex;align-items:center;justify-content:center;gap:10px;font-size:36px;line-height:1}
.cells{display:flex;gap:6px;margin-left:2px}
.cell{width:54px;height:66px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0 0;cursor:pointer;transition:border-color .15s}
.cell .cl{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:11px;font-weight:700;line-height:1.2}
.cell.t .cl{color:var(--ten-ink)}
.cell.o .cl{color:var(--one-ink)}
.cell .cv{font-size:34px;line-height:1.25;color:var(--ink)}
.cell.t.sel{border-color:var(--ten)}
.cell.o.sel{border-color:var(--one)}
.cell.ok{border-color:var(--one);background:var(--one-soft)}
.cell.shown{border-style:dashed;border-color:var(--ink2)}
.cell.bad{animation:wobble .42s}
@keyframes wobble{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}

.tray{position:relative;border-radius:20px;padding:14px 10px 16px;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--tray-ink);overflow-x:auto;
  background:repeating-linear-gradient(97deg,rgba(255,255,255,.07) 0 3px,transparent 3px 11px),var(--wood);
  box-shadow:0 2px 0 #D9BD8E,0 4px 0 #B99A68,0 6px 0 #D9BD8E,0 8px 0 #B0915F,0 10px 0 #9A7B4F;margin-bottom:10px}
.tray.compact{min-height:96px}
.msg{min-height:46px;font-size:16px;color:var(--ink2);line-height:1.4;padding:0 4px}
.msg.flash{animation:flash .6s}
.msg.good{color:var(--good);font-weight:700}
.msg .note{display:block;font-size:15px;color:var(--ink2);font-weight:400;margin-top:2px}
@keyframes flash{30%{color:var(--ink)}}

.cb{--s:22px;display:block;width:var(--s);height:var(--s);border-radius:6px;flex:none;position:relative;
  background:radial-gradient(90% 70% at 28% 22%,rgba(255,255,255,.62) 0 18%,rgba(255,255,255,0) 55%),linear-gradient(150deg,var(--cl) 0%,var(--c) 48%,var(--cd) 100%);
  box-shadow:inset 0 0 0 1px rgba(20,60,15,.16),inset 0 -2px 0 rgba(0,0,0,.13),0 2px 0 var(--cdd),0 3px 4px rgba(60,40,10,.22)}
.cb.o{--c:#52B34A;--cl:#97DF7E;--cd:#3B9136;--cdd:#2B6B27}
.cb.sm{--s:13px;border-radius:4px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14),0 1.5px 0 var(--cdd)}
.cb.bone{display:grid;place-items:center}
.cb.bone svg{width:86%;height:86%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.cb.ph{visibility:hidden}
body.pakjes .cb.o{--c:#A0662E;--cl:#D8A066;--cd:#7E4C1F;--cdd:#5E3714;border-radius:50%}
.bar{display:block;width:13px;height:100px;border-radius:4px;flex:none;position:relative;
  background:repeating-linear-gradient(180deg,transparent 0 8px,rgba(12,45,95,.5) 8px 9px,rgba(255,255,255,.3) 9px 10px),linear-gradient(90deg,#8AC0F4 0%,#5199E4 30%,#3F86DB 62%,#2A69B8 100%);
  box-shadow:inset 0 0 0 1px rgba(12,45,95,.35),inset 0 2px 0 rgba(255,255,255,.45),2px 2px 0 #1F5BA6,2px 4px 5px rgba(60,40,10,.22)}
.bar.g5{margin-left:8px}
.bar.ghost{background:rgba(255,255,255,.18);box-shadow:none;border:2px dashed rgba(90,67,37,.45);animation:breathe 1.8s ease-in-out infinite}
[data-act]{cursor:pointer}
.tray .cb[data-act],.tray .bar[data-act],.tray .acells[data-act]{transition:transform .1s ease-out}
.tray .cb[data-act]:active,.tray .bar[data-act]:active,.tray .acells[data-act]:active{transform:scale(.86)}

.mat{display:grid;grid-template-columns:18px auto auto;column-gap:12px;row-gap:8px;align-items:end;justify-content:center}
.mh{font-size:11px;font-weight:700;letter-spacing:.03em;text-align:center;justify-self:center;align-self:end;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(90,60,25,.18)}
.mh.t{color:var(--ten-d)}.mh.o{color:var(--one-d)}
.sign{font-size:30px;line-height:1;align-self:center;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.tcell{display:flex;gap:3px;align-items:flex-end;justify-content:center;min-height:100px;min-width:140px}
.ocell{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:flex-end;min-width:136px;min-height:61px}
.ledge{grid-column:1/-1;height:0;border-top:2px solid rgba(90,60,25,.24);box-shadow:0 1px 0 rgba(255,255,255,.5);margin:3px 0}
.frame{position:relative;display:grid;grid-template-columns:repeat(5,22px);gap:3px;padding:5px;border-radius:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(120,85,40,.1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1.5px rgba(120,85,40,.28),0 1px 0 rgba(255,255,255,.35)}
.sl{display:block;width:22px;height:22px;border-radius:6px;background:rgba(95,65,25,.14);box-shadow:inset 0 2px 3px rgba(70,45,15,.32),0 1px 0 rgba(255,255,255,.45)}
.sl.off{visibility:hidden}
.sl.tgt{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(90,67,37,.38)}
.frame.full{overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 3px var(--go),0 0 18px rgba(255,138,61,.55);animation:nudge 1.3s ease-in-out infinite}
.frame.full::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);animation:sheen 2s ease-in-out infinite;pointer-events:none}
.frame.ghost{background:rgba(255,255,255,.12);box-shadow:none;outline:2px dashed rgba(90,67,37,.45);outline-offset:-2px;animation:breathe 1.8s ease-in-out infinite}
.frame.ghost .sl{background:none;box-shadow:none}
.frame.track{background:rgba(255,255,255,.1);box-shadow:none;outline:2px dashed rgba(90,67,37,.35);outline-offset:-2px}
.frame.unfold .cb{animation:unfold .55s cubic-bezier(.2,.9,.3,1.35) backwards;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes unfold{from{transform:translate(var(--ux,0),var(--uy,0)) scale(.25);opacity:0}}
@keyframes sheen{55%,100%{transform:translateX(130%)}}
@keyframes breathe{50%{opacity:.45}}
.pic .cb{background:rgba(82,179,74,.16);box-shadow:none;border:2.5px solid var(--c)}
.pic .cb.bone svg{display:none}
.pic .bar{background:rgba(63,134,219,.14);border:2px solid #3F86DB;box-shadow:none}
.pic .frame{background:none;box-shadow:inset 0 0 0 1.5px rgba(120,85,40,.2)}
.pic .frame.track{outline-color:rgba(90,67,37,.25)}
.pic .sl{background:none;box-shadow:none}
.nofr .frame,.nofr .frame.track{box-shadow:none;outline-color:transparent}

.mmat,.dmat{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.mmat .ledge,.dmat .ledge{width:100%}
.arr{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.arow{display:flex;align-items:center;gap:10px}
.acells{display:flex;gap:3px;padding:3px;border-radius:8px}
.acells .g5{margin-left:6px}
.arow.ghost .acells{outline:2px dashed rgba(90,67,37,.42);outline-offset:-1px;animation:breathe 1.8s ease-in-out infinite}
.arow.ghost .cb{visibility:hidden}
.skip{font-size:20px;min-width:28px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.mshelf{display:flex;align-items:center;gap:10px}
.rowpiece{background:rgba(255,255,255,.3);box-shadow:0 0 0 3px var(--go),0 0 16px rgba(255,138,61,.45);animation:nudge 1.6s ease-in-out infinite}
.pile{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:290px;min-height:20px}
.bowls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.bowl{position:relative;width:54px;min-height:52px;border-radius:6px 6px 50% 50%/6px 6px 62% 62%;display:flex;align-items:flex-end;justify-content:center;padding:6px 3px 10px;transform-origin:50% 100%;
  background:radial-gradient(120% 70% at 50% 8%,#FFFDF8 0 45%,#EEE4D3 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.95),inset 0 -7px 10px rgba(130,95,50,.2),0 3px 0 #CBBBA0,0 5px 7px rgba(60,40,10,.25)}
.bowl::before{content:"";position:absolute;left:-3px;right:-3px;top:-4px;height:9px;border-radius:50%;background:#FFFDF8;box-shadow:0 1px 0 #D6C9B1,inset 0 -2px 3px rgba(130,95,50,.22)}
.bin{display:grid;grid-template-columns:repeat(3,13px);gap:2px}
.show-btn{display:inline-flex;align-items:center;gap:8px}
.show-btn svg{width:22px;height:22px}

.flyer{position:fixed;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;will-change:transform}
.flyer>.cb,.flyer>.bar{width:100%;height:100%}
.spark{position:fixed;z-index:70;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:2px;pointer-events:none}
.spark.r{border-radius:50%}
.cv.typed{display:inline-block;animation:pop .32s ease-out}
.pop{animation:pop .42s ease-out}
.shake{animation:shake .32s}
@keyframes pop{0%{transform:scale(1.35)}60%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes nudge{50%{transform:scale(1.04)}}
.land{animation:land .42s ease-out}
@keyframes land{0%{transform:scale(1.22,.72)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.04,.97)}100%{transform:none}}

.pad{display:grid;grid-template-columns:repeat(5,1fr) 1.15fr;gap:6px;max-width:400px;margin:0 auto}
.pad .erase{grid-column:6;grid-row:1/span 2;height:auto!important}
.next{display:block;width:100%;max-width:400px;margin:12px auto 0}
.conf{position:fixed;z-index:75;pointer-events:none;margin:-5px 0 0 -5px}
.conf.cb{--s:11px;border-radius:3px}
.conf.bar{width:6px;height:22px;border-radius:2px}
.conf.sq{width:9px;height:9px;border-radius:2px}
.conf.go{background:#FF8A3D}
.conf.sun{background:#FFD27A}
.spark-line{display:block;margin-top:6px}
.pad button{height:50px;border:0;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:24px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pad button svg{width:24px;height:24px}

#done{position:relative;text-align:center;padding:30px 10px 40px;overflow:hidden;min-height:75vh}
#done .dogwrap{width:168px;height:168px;margin:0 auto 14px;cursor:pointer}
#done p{color:var(--ink2);max-width:42ch;margin:8px auto}
.notes{list-style:none;padding:0;margin:18px auto 24px;max-width:440px;display:grid;gap:8px}
.notes li{background:var(--card);border-radius:14px;padding:10px 14px;text-align:left}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-30px;animation:fall linear forwards}
.confetti .bar{height:60px;width:9px}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

.glist{display:grid;gap:10px;margin:18px 0 26px}
.gcard{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.gtext{flex:1;min-width:210px}
.gtext p{margin:2px 0;color:var(--ink2);font-size:15px}
.gintro{color:var(--ink2);max-width:60ch;margin:6px 0 0}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}

@media (min-width:860px){
  .sess{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"label pad" "eq pad" "tray pad" "msg pad";column-gap:32px;align-items:start}
  .padw{align-self:center}
  .pad button{height:60px}
  .eq{font-size:44px}
  .cell{width:62px;height:76px}
  .cell .cv{font-size:40px}
}
@media (max-width:370px){
  .eq{font-size:30px;gap:6px}
  .cell{width:48px;height:60px}
  .cell .cv{font-size:30px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}

function blankSkill(){return{stage:1,streak:0,wrongRun:0,mastered:false,seen:0,first:0,err:{}}}
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=null}
  if(!d||typeof d!=='object')d={};
  d.lang=d.lang||((navigator.language||'').toLowerCase().startsWith('nl')?'nl':'en');
  d.sound=d.sound!==false;
  d.skills=d.skills||{};
  SK.forEach(s=>{d.skills[s.id]=Object.assign(blankSkill(),d.skills[s.id]||{})});
  d.days=Array.isArray(d.days)?d.days:[];
  d.missed=Array.isArray(d.missed)?d.missed:[];
  d.times=d.times&&typeof d.times==='object'?d.times:{};
  return d;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const L=()=>T[S.lang];
const st=id=>S.skills[id];
const skName=id=>L().sk[id].join(' ');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayIso=()=>iso(new Date());
const currentSkill=()=>SK.find(s=>!st(s.id).mastered);

(function(){const n=new Date();if(n.getMonth()===11&&n.getDate()===5)document.body.classList.add('pakjes')})();

/* sound */
let AC=null;
function tone(f,dur,type,vol,when){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
const SND={
  tap:()=>tone(520,.05,'triangle',.05),
  snap:()=>{tone(660,.06,'triangle',.08);tone(990,.1,'triangle',.08,.06)},
  crack:()=>{tone(190,.07,'square',.035);tone(130,.1,'square',.035,.05)},
  pop:()=>tone(760,.05,'sine',.06),
  good:()=>{tone(523,.12,'triangle',.07);tone(659,.12,'triangle',.07,.1);tone(784,.2,'triangle',.07,.2)},
  soft:()=>{tone(330,.18,'sine',.06);tone(294,.24,'sine',.06,.14)},
  done:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.07,i*.12))}
};

const moodTimers=new WeakMap();
function mood(el,m,ms){
  if(!el)return;
  el.classList.remove('happy','think','gentle','sleep','roll');
  clearTimeout(moodTimers.get(el));
  if(m){void el.offsetWidth;el.classList.add(m)}
  if(m&&ms)moodTimers.set(el,setTimeout(()=>el.classList.remove(m),ms));
}
let taps=0,tapTimer=null;
function petDog(el){
  if(el.classList.contains('sleep')){mood(el,'');return}
  taps++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{taps=0},2500);
  const b=el.querySelector('.bubble');
  if(taps>=7){taps=0;mood(el,'roll',950);b.textContent='';b.classList.remove('on');SND.done();return}
  b.textContent=pick(L().woof);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),900);
  mood(el,'happy',900);SND.pop();
}

/* header */
function renderHeader(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
  const sb=$('#soundBtn');sb.innerHTML=S.sound?ICON.on:ICON.off;sb.setAttribute('aria-label',L().sound);sb.setAttribute('aria-pressed',String(S.sound));
  $('#quit').setAttribute('aria-label',L().quit);
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang;save();renderHeader();rerender()}));
$('#soundBtn').addEventListener('click',()=>{S.sound=!S.sound;save();renderHeader();SND.tap()});

let screen='home';
function show(id){
  screen=id;
  ['home','session','done','grown'].forEach(s=>{$('#'+s).hidden=s!==id});
  $('#topbar').hidden=id==='session';
  window.scrollTo(0,0);
}
function rerender(){
  if(screen==='home')renderHome();
  else if(screen==='grown')renderGrown();
  else if(screen==='session'&&P){renderProblem()}
  else if(screen==='done')renderDone(false);
}

/* home */
function renderHome(){
  const l=L(),doneToday=S.days.includes(todayIso()),cur=currentSkill();
  const now=new Date(),dow=(now.getDay()+6)%7;
  let week='';
  for(let i=0;i<7;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i),k=iso(d);
    week+=`<span class="day${S.days.includes(k)?' on':''}${i===dow?' today':''}" aria-label="${k}">${l.days[i]}</span>`}
  let path='';
  SK.forEach(s=>{const k=st(s.id),isCur=cur&&cur.id===s.id,locked=!k.mastered&&!isCur;
    const pips=l.stages.map((g,i)=>`<span class="pip${k.mastered||k.stage>i&&!locked?' on':''}">${g}</span>`).join('');
    path+=`<li class="${k.mastered?'done':isCur?'cur':'lock'}"><span class="opt f">${s.op}</span><div class="ptxt"><div class="pname">${l.sk[s.id][0]}</div><div class="psub">${l.sk[s.id][1]}</div><div class="pips">${k.mastered?`<span class="pip on">${l.mastered}</span>`:pips}</div></div></li>`});
  $('#home').innerHTML=`
    <div class="hero"><div class="dogwrap dog" id="hdog">${dogSVG()}</div><div><h1>${l.hello}</h1><p>${l.helloSub}</p></div></div>
    <div class="today"><div><h2>${doneToday?l.doneTodayTitle:l.todayTitle}</h2><p>${doneToday?l.doneTodayMeta:l.todayMeta}</p></div>
      <div class="acts"><button class="btn${doneToday?' quiet':''}" id="startBtn">${doneToday?l.again:l.start}</button></div></div>
    <div class="week"><span class="lbl">${l.week}</span>${week}</div>
    <h2>${l.path}</h2><ol class="path">${path}</ol>
    <div class="home-foot"><button class="link" id="toGrown">${l.grown}</button></div>`;
  $('#startBtn').addEventListener('click',()=>{SND.tap();startSession()});
  $('#toGrown').addEventListener('click',()=>{show('grown');renderGrown()});

}

/* problems */
function gen(skill){
  let a,b,ans,op=SK.find(s=>s.id===skill).op,at,ao,bt,bo;
  if(skill==='add1'){at=ri(1,7);bt=ri(1,8-at);ao=ri(1,8);bo=ri(1,9-ao)}
  else if(skill==='add2'){at=ri(1,6);bt=ri(1,7-at);ao=ri(2,9);bo=ri(10-ao,9)}
  else if(skill==='sub1'){at=ri(2,9);ao=ri(1,9);bt=ri(1,at-1);bo=ri(0,ao)}
  else if(skill==='sub2'){at=ri(2,9);ao=ri(0,8);bo=ri(ao+1,9);bt=ri(0,at-1)}
  if(skill==='mul'){a=ri(2,5);b=ri(2,6);ans=a*b}
  else if(skill==='div'){b=ri(2,5);ans=ri(2,6);a=b*ans}
  else{a=at*10+ao;b=bt*10+bo;ans=op==='+'?a+b:a-b}
  return{skill,op,a,b,ans,at,ao,bt,bo,key:skill+a+op+b};
}

  if(cur){[2,6].forEach(k=>{
    if(S.missed.length)plan[k]={review:true,missed:S.missed.shift()};

  })}else plan.forEach(p=>{if(S.missed.length)p.missed=S.missed.shift()});

    let n=0;do{prob=gen(skill);n++}while(sess.seen.has(prob.key)&&n<25);
  }

  if(P.op==='−')return matPV('−',barsHTML(P.at),framesHTML([P.ao]),trackTens(P.bt,0),trackFrame(P.bo,0));

      framesHTML(ps.frames,{tradeable:true,extraEmpty:ps.sO>0&&ps.frames.every(f=>f===10),bone:ps.bone}),

/* flight */
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
function fly(src,dest,html,o){
  o=o||{};
  return new Promise(res=>{
    if(!src||!dest){res();return}
    const a=src.getBoundingClientRect(),b=dest.getBoundingClientRect();
    const size=o.size==='dest'?b:a;
    const dur=REDUCE?0:(ps&&ps.locked?210:(o.dur||380));
    if(!o.keep)src.style.visibility='hidden';
    if(!dur){res();return}
    const c=document.createElement('div');c.className='flyer';
    c.style.left=(a.left+a.width/2-size.width/2)+'px';c.style.top=(a.top+a.height/2-size.height/2)+'px';
    c.style.width=size.width+'px';c.style.height=size.height+'px';
    c.innerHTML=html;document.body.appendChild(c);
    const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);
    const lift=Math.min(44,16+Math.hypot(dx,dy)*.09),rot=dx>=0?7:-7;
    const sh=(y,bl)=>`drop-shadow(0 ${y}px ${bl}px rgba(60,40,10,.28))`;
    const done=()=>{c.remove();res()};
    if(!c.animate){setTimeout(done,dur);return}
    c.animate([
      {transform:`translate(0,0) scale(${o.popIn?.2:1}) rotate(0deg)`,filter:sh(2,2),offset:0},
      {transform:`translate(${dx*.1}px,${dy*.1-lift*.65}px) scale(${o.popIn?1.3:1.18}) rotate(${-rot*.6}deg)`,filter:sh(10,8),offset:.24},
      {transform:`translate(${dx*.62}px,${dy*.62-lift}px) scale(1.12) rotate(${rot}deg)`,filter:sh(13,10),offset:.62},
      {transform:`translate(${dx}px,${dy}px) scale(1) rotate(0deg)`,filter:sh(2,2),offset:1}
    ],{duration:dur,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'}).onfinish=done;
  });
}
function landAt(pt){
  if(!pt||REDUCE)return;
  const e=document.elementFromPoint(pt.x,pt.y),t=e&&e.closest('.cb,.bar,.acells');
  if(t&&t.closest('#tray')){t.classList.remove('land','pop');void t.offsetWidth;t.classList.add('land')}
}
function burst(pt,colors,n,dist){
  if(!pt||REDUCE)return;
  n=n||12;dist=dist||40;
  for(let i=0;i<n;i++){
    const d=document.createElement('i');d.className='spark'+(i%3===0?' r':'');
    d.style.left=pt.x+'px';d.style.top=pt.y+'px';d.style.background=colors[i%colors.length];
    document.body.appendChild(d);
    const ang=i/n*Math.PI*2+Math.random()*.5,r=dist*(.65+Math.random()*.6);
    d.animate([{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},{transform:`translate(${Math.cos(ang)*r}px,${Math.sin(ang)*r}px) scale(.2) rotate(${ri(90,270)}deg)`,opacity:0}],
      {duration:520+Math.random()*240,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=()=>d.remove();
  }
}
function cheer(){

function popConfetti(pt){

const GREENS=['#97DF7E','#52B34A','#FFD27A'],MIX=['#97DF7E','#8AC0F4','#FFD27A','#FFFFFF'];

async function go(fn){ps.busy=true;try{await fn()}finally{ps.busy=false}}
function handle(act,el){
  const l=L();
  if(act==='show'){if(finished&&!ps.locked)return;helped=true;ps.view='shown';SND.tap();render();return}
  if(!ps||ps.busy||ps.locked||finished||ps.view!=='build')return;

    const full=ps.frames.findIndex(f=>f===10);
    if(act==='bmove')go(()=>addMoveOne(el));
    else if(act==='trade')go(()=>addTrade(+el.dataset.fi));
    else if(act==='bten'){
      if(ps.sO>0)renderHint(l.hOnesFirst);
      else if(full>=0)renderHint(l.hTradeFirst);
      else go(()=>addMoveTen(el));
    }
  }else if(P.op==='−'){
    const rem=P.bo-ps.takenO;
    if(act==='aone'){
      if(rem>0)go(()=>subTakeOne(el));
      else renderHint(ps.takenT<P.bt?l.hTakeTens(P.bt-ps.takenT):l.hWrite);
    }else if(act==='aten'){
      if(rem>0){if(sum(ps.frames)<rem)go(()=>subOpenTen(el));else renderHint(l.hEnough)}
      else if(ps.takenT<P.bt)go(()=>subTakeTen(el));
      else renderHint(l.hWrite);
    }
  }else if(P.op==='×'){
    if(act==='addrow')go(mulAddRow);
    else if(act==='delrow')go(()=>mulDelRow(el));
  }else if(act==='deal')go(divDeal);
}
$('#tray').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)handle(el.dataset.act,el)});

/* replay: the same moves, played for her */
async function replay(){
  const s=initBuild();s.locked=true;s.view='build';ps=s;renderTray();
  const ok=()=>ps===s&&screen==='session';
  await wait(REDUCE?0:450);
  if(P.op==='+'){
    while(ok()&&s.sO>0){await addMoveOne();await wait(20)}
    const fi=s.frames.findIndex(f=>f===10);
    if(ok()&&fi>=0){await wait(250);await addTrade(fi)}
    while(ok()&&s.sT>0){await wait(60);await addMoveTen()}
  }else if(P.op==='−'){
    while(ok()&&s.takenO<P.bo){
      if(sum(s.frames)<P.bo-s.takenO){await subOpenTen();await wait(250)}
      else{await subTakeOne();await wait(20)}
    }
    while(ok()&&s.takenT<P.bt){await wait(60);await subTakeTen()}
  }else if(P.op==='×'){
    while(ok()&&s.rows<P.a){await mulAddRow();await wait(120)}
  }else{
    while(ok()&&s.pile>0){await divDeal();await wait(150)}
  }
}

/* answer entry */
let lastTyped=null,cooling=false,chkT=null,advT=null,tAct=0,tLast=0;
function tick(){const n=performance.now();tAct+=Math.min(n-tLast,30000);tLast=n}
function renderEq(){
  const l=L();
  const cell=k=>`<button class="cell ${k}${sel===k&&!finished?' sel':''}${cellMode?' '+cellMode:''}" data-cell="${k}" aria-label="${k==='t'?'tens':'ones'}"><span class="cl">${k==='t'?l.colT:l.colO}</span><span class="cv f${lastTyped===k?' typed':''}">${vals[k]}</span></button>`;
  $('#eq').innerHTML=`<span>${P.a}</span><span${P.review?' class="opx"':''}>${P.op}</span><span>${P.b}</span><span>=</span><div class="cells">${cell('t')}${cell('o')}</div>`;
}
$('#eq').addEventListener('click',e=>{const c=e.target.closest('[data-cell]');if(!c||finished)return;sel=c.dataset.cell;SND.tap();renderEq()});
function renderPad(){
  const l=L();
  $('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-d="${d}">${d}</button>`).join('')+
    `<button class="erase" data-erase="1" aria-label="erase">${ICON.erase}</button>`;
  $('#next').textContent=sess.i===7?l.finish:l.next;
}
function typeDigit(d){
  if(finished||cooling)return;
  vals[sel]=String(d);lastTyped=sel;
  if(sel==='o')sel='t';
  mood($('#sdog'),'think',1400);SND.tap();renderEq();lastTyped=null;
  clearTimeout(chkT);
  if(vals.o!==''&&(P.ans<10||vals.t!==''))chkT=setTimeout(check,REDUCE?0:280);
}
function erase(){
  if(finished)return;
  clearTimeout(chkT);
  if(vals[sel]==='')sel=sel==='t'?'o':'t';
  vals[sel]='';SND.tap();renderEq();
}
$('#pad').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.erase)erase();
  else typeDigit(b.dataset.d);
});

function slip(v){
  if(P.op==='+'&&P.ao+P.bo>=10&&v===P.ans-10)return 'carry';
  if(P.op==='−'&&P.bo>P.ao){
    if(v===(P.at-P.bt)*10+(P.bo-P.ao))return 'flip';
    if(v===P.ans+10)return 'keep';
  }
  if(P.op==='×'&&v===P.a+P.b)return 'added';
  return 'other';
}
function slipMsg(type){
  const l=L();
  if(type==='carry')return l.mCarry(P.ao,P.bo);
  if(type==='flip')return l.mFlip(P.ao,P.bo);
  if(type==='keep')return l.mKeep;
  if(type==='added')return l.mAdded(P.a,P.b);
  return l.mLook;
}
function grade(result){
  const s=st(P.skill),l=L();
  s.seen++;if(result==='first')s.first++;
  if(P.review)return null;
  let note=null;
  if(result==='first'){
    s.wrongRun=0;s.streak++;
    if(s.stage<3&&s.streak>=3){s.stage++;s.streak=0;note=l.lvlStage(skName(P.skill),l.stages[s.stage-1])}
    else if(s.stage===3&&s.streak>=4){s.mastered=true;s.streak=0;note=l.lvlMaster(skName(P.skill))}
  }else if(result==='second'){s.streak=0}
  else if(result==='wrong'){
    s.streak=0;s.wrongRun++;
    if(s.wrongRun>=2&&s.stage>1){s.stage--;s.wrongRun=0;note=l.lvlDown}
  }
  return note;
}
function queueMissed(){
  const {skill,op,a,b,ans,at,ao,bt,bo,key}=P;
  if(!S.missed.some(m=>m.key===key))S.missed.push({skill,op,a,b,ans,at,ao,bt,bo,key});
  if(S.missed.length>12)S.missed.shift();
}
function check(){
  if(finished||vals.o==='')return;
  const l=L();tick();
  const v=(vals.t===''?0:+vals.t)*10+(+vals.o);
  attempts++;msgLock=true;
  if(v===P.ans){
    finished=true;cellMode='ok';
    const result=attempts===1?(helped?'helped':'first'):'second';
    if(result==='first')sess.first++;
    sess.marks[sess.i]='done';
    const note=grade(result);if(note)sess.notes.push(note);
    setMsg(`${pick(l.praise)}${note?`<span class="note">${note}</span>`:''}`,'good');
    mood($('#sdog'),'happy',1800);SND.good();cheer();
    if(result==='first'){const a=S.times[P.skill]=S.times[P.skill]||[];a.push({s:P.stage,t:Math.round(tAct/100)/10,d:todayIso()});if(a.length>80)a.splice(0,a.length-80)}
    if(ps)ps.locked=true;
    clearTimeout(idleT);
    advT=setTimeout(()=>{if(screen==='session'&&finished)nextProblem()},1900);
  }else{
    const type=slip(v),s=st(P.skill);s.err[type]=(s.err[type]||0)+1;
    mood($('#sdog'),'gentle',2200);SND.soft();
    cellMode='bad';
    if(attempts===1){
      setMsg(slipMsg(type)+' '+l.tryAgain);
      cooling=true;
      setTimeout(()=>{cooling=false;if(finished)return;cellMode='';vals={t:'',o:''};sel='o';renderEq()},450);
    }else{
      finished=true;sess.marks[sess.i]='miss';
      const note=grade('wrong');if(note)sess.notes.push(note);
      queueMissed();
      $('#next').hidden=false;
      setMsg(`${l.reveal(P.ans)}${note?`<span class="note">${note}</span>`:''}`);
      setTimeout(()=>{cellMode='shown';vals={t:P.ans>=10?String(Math.floor(P.ans/10)):'',o:String(P.ans%10)};renderEq()},450);
      clearTimeout(idleT);
    }
    replay();
  }
  save();renderProg();renderEq();renderPad();
}
function nextProblem(){clearTimeout(advT);clearTimeout(chkT);SND.tap();sess.i++;if(sess.i>=8)endSession();else loadProblem()}
$('#next').addEventListener('click',()=>{if(finished)nextProblem()});
$('#quit').addEventListener('click',()=>{clearTimeout(idleT);clearTimeout(advT);clearTimeout(chkT);P=null;ps=null;show('home');renderHome()});

/* idle: Spartacus naps */
let idleT=null;
function poke(){
  clearTimeout(idleT);
  const d=$('#sdog');
  if(d&&d.classList.contains('sleep'))mood(d,'');
  if(screen==='session'&&!finished)idleT=setTimeout(()=>mood($('#sdog'),'sleep'),45000);
}
document.addEventListener('pointerdown',e=>{if(screen!=='session')return;tick();if(!e.target.closest('#sdog'))poke()});
document.addEventListener('visibilitychange',()=>{if(screen==='session'&&!document.hidden)tLast=performance.now()-1});
$('#sdog').addEventListener('click',()=>{petDog($('#sdog'));poke()});
document.addEventListener('keydown',e=>{
  if(screen!=='session'||!P)return;
  if(/^[0-9]$/.test(e.key)){typeDigit(e.key);e.preventDefault()}
  else if(e.key==='Backspace'){erase();e.preventDefault()}
  else if(e.key==='Enter'){e.preventDefault();if(finished&&!$('#next').hidden)nextProblem()}
});

/* end of session */
const med=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function speedNotes(){
  const today=todayIso(),l=L();
  SK.forEach(k=>{
    const es=S.times[k.id]||[],td=es.filter(e=>e.d===today);if(td.length<3)return;
    for(const stg of [...new Set(td.map(e=>e.s))].reverse()){
      const now=td.filter(e=>e.s===stg),before=es.filter(e=>e.d<today&&e.s===stg).slice(-15);
      if(now.length<3||before.length<3)continue;
      const a=med(now.map(e=>e.t)),b=med(before.map(e=>e.t));
      if(a<b*0.9&&Math.round(a)<Math.round(b)){sess.notes.push(l.quicker(skName(k.id),Math.round(a),Math.round(b)));break}
    }
  });
}
function timeLine(id){
  const es=S.times[id]||[];if(!es.length)return '';
  const l=L(),stg=es[es.length-1].s,sameStage=es.filter(e=>e.s===stg);
  const last=sameStage.slice(-10),prev=sameStage.slice(-20,-10);
  let h=`<p>${l.timeLine(l.stages[stg-1],Math.round(med(last.map(e=>e.t))),last.length,prev.length>=3?Math.round(med(prev.map(e=>e.t))):null)}</p>`;
  const days=[...new Set(sameStage.map(e=>e.d))].slice(-10);
  if(days.length>=2){
    const v=days.map(d=>med(sameStage.filter(e=>e.d===d).map(e=>e.t))),mx=Math.max(...v),mn=Math.min(...v),W=140,H=30;
    const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(4+(mx===mn?.5:(y-mn)/(mx-mn))*(H-8)).toFixed(1)}`).join(' ');
    h+=`<svg class="spark-line" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--ten)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  return h;
}
function endSession(){
  const k=todayIso();if(!S.days.includes(k))S.days.push(k);
  if(S.days.length>120)S.days=S.days.slice(-120);
  speedNotes();save();P=null;show('done');renderDone(true);
}
function renderDone(first){
  const l=L(),perfect=sess.first===8;
  $('#done').innerHTML=`<div class="confetti" id="conf"></div>
    <div class="dogwrap dog" id="ddog">${dogSVG()}</div>
    <h1>${l.doneTitle}</h1>
    <p>${l.summary(sess.first,8)}${perfect?' '+l.perfect:''}</p>
    ${sess.notes.length?`<ul class="notes">${sess.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`:'<div style="height:18px"></div>'}
    <button class="btn" id="homeBtn">${l.backHome}</button>`;
  const dd=$('#ddog');dd.addEventListener('click',()=>petDog(dd));
  $('#homeBtn').addEventListener('click',()=>{SND.tap();show('home');renderHome()});
  if(first){mood(dd,'happy',2600);SND.done();if(perfect)confetti()}
}
function confetti(){
  const c=$('#conf');if(!c)return;let h='';
  for(let i=0;i<40;i++){const ten=Math.random()<0.35;
    h+=`<i class="${ten?'bar':'cb o'}" style="left:${Math.round(Math.random()*100)}%;${ten?'':'--s:'+ri(12,20)+'px;'}animation-duration:${(2.2+Math.random()*1.8).toFixed(2)}s;animation-delay:${(Math.random()*0.8).toFixed(2)}s"></i>`}
  c.innerHTML=h;
}

/* grown-ups */
function renderGrown(){
  const l=L(),cur=currentSkill();
  const cards=SK.map(s=>{const k=st(s.id),pct=k.seen;
    let line=k.mastered?l.masteredLine(k.seen,k.first):k.seen?l.stageLine(l.stages[k.stage-1],k.seen,k.first):l.notStarted;
    const errs=Object.entries(k.err).sort((a,b)=>b[1]-a[1]);
    const slipLine=errs.length?`<p>${l.mostSlip(l.slips[errs[0][0]]||l.slips.other,errs[0][1])}</p>`:'';
    const isCur=cur&&cur.id===s.id;
    return `<div class="gcard"><span class="opt f" style="${isCur?'background:var(--go);color:var(--go-ink)':k.mastered?'background:var(--one);color:#0F3A0C':''}">${s.op}</span>
      <div class="gtext"><div class="pname">${skName(s.id)}</div><p>${line}</p>${slipLine}${timeLine(s.id)}</div>
      ${isCur?`<span class="chip">${l.current}</span>`:`<button class="btn quiet sm" data-here="${s.id}">${l.startHere}</button>`}</div>`}).join('');
  $('#grown').innerHTML=`<div class="backrow"><button class="icon-btn" id="gback" aria-label="${l.backHome}">${ICON.back}</button><h1>${l.grownTitle}</h1></div>
    <p class="gintro">${l.grownIntro}</p>
    <div class="glist">${cards}</div>
    <button class="btn quiet sm danger" id="resetBtn">${l.reset}</button>`;
  $('#gback').addEventListener('click',()=>{show('home');renderHome()});
  document.querySelectorAll('[data-here]').forEach(b=>b.addEventListener('click',()=>confirmTap(b,()=>startHere(b.dataset.here))));
  const rb=$('#resetBtn');rb.addEventListener('click',()=>confirmTap(rb,()=>{SK.forEach(s=>{S.skills[s.id]=blankSkill()});S.days=[];S.missed=[];S.times={};save();renderGrown()}));
}
function confirmTap(btn,fn){
  if(btn.dataset.armed){fn();return}
  const orig=btn.textContent;btn.dataset.armed='1';btn.textContent=L().confirm;
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=orig}},3000);
}
function startHere(id){
  const idx=SK.findIndex(s=>s.id===id);
  SK.forEach((s,i)=>{const k=st(s.id);
    if(i<idx){k.mastered=true;k.stage=3}
    else{k.mastered=false;k.stage=1;k.streak=0;k.wrongRun=0}});
  S.missed=S.missed.filter(m=>SK.findIndex(s=>s.id===m.skill)<idx);
  save();renderGrown();
}

renderHeader();renderHome();
})();
</script>
